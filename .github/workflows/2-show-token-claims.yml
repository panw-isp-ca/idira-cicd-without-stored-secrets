name: "2. Who is this job? GitHub's signed token"

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  show-claims:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    steps:
      - name: Print the claims in this job's GitHub token
        run: |
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=idira-secrets-manager" | jq -r .value)
          echo "$token" | jq -R 'split(".")[1] | gsub("-"; "+") | gsub("_"; "/")
            | . + ("=" * ((4 - length % 4) % 4)) | @base64d | fromjson
            | {sub, repository, repository_owner, repository_owner_id, environment, ref, aud, iss, workflow_ref, event_name, actor}'
