name: "After: secrets fetched from Idira"

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - name: "Scan: fetch the SonarQube token from Idira"
        uses: cyberark/conjur-action@f15cb4a7a519b66fd902e615840dd881c01839c5 # v3.0.1
        with:
          url: ${{ vars.CONJUR_URL }}
          account: ${{ vars.CONJUR_ACCOUNT }}
          authn_id: ${{ vars.CONJUR_AUTHN_ID }}
          audience: idira-secrets-manager
          secrets: data/vault/${{ vars.SAFE }}/fake-sonarqube-token/password|SONAR_TOKEN

      - name: "Scan: scan the code with SonarQube (simulated)"
        run: |
          echo "SONAR_TOKEN from Idira: $(echo "$SONAR_TOKEN" | sed 's/./& /g')"
          echo "Simulated: sonar-scanner -Dsonar.token=\$SONAR_TOKEN"

      - name: "Publish: fetch the registry credential from Idira"
        uses: cyberark/conjur-action@f15cb4a7a519b66fd902e615840dd881c01839c5 # v3.0.1
        with:
          url: ${{ vars.CONJUR_URL }}
          account: ${{ vars.CONJUR_ACCOUNT }}
          authn_id: ${{ vars.CONJUR_AUTHN_ID }}
          audience: idira-secrets-manager
          secrets: data/vault/${{ vars.SAFE }}/fake-registry-push/username|REGISTRY_USERNAME;data/vault/${{ vars.SAFE }}/fake-registry-push/password|REGISTRY_PASSWORD

      - name: "Publish: push the image to the registry (simulated)"
        run: |
          echo "REGISTRY_USERNAME from Idira: $(echo "$REGISTRY_USERNAME" | sed 's/./& /g')"
          echo "REGISTRY_PASSWORD from Idira: $(echo "$REGISTRY_PASSWORD" | sed 's/./& /g')"
          echo "Simulated: docker login registry.fake.example -u \$REGISTRY_USERNAME -p \$REGISTRY_PASSWORD"
          echo "Simulated: docker push registry.fake.example/payments-api:${GITHUB_SHA::7}"

      - name: "Sign: fetch the signing key from Idira"
        uses: cyberark/conjur-action@f15cb4a7a519b66fd902e615840dd881c01839c5 # v3.0.1
        with:
          url: ${{ vars.CONJUR_URL }}
          account: ${{ vars.CONJUR_ACCOUNT }}
          authn_id: ${{ vars.CONJUR_AUTHN_ID }}
          audience: idira-secrets-manager
          secrets: data/vault/${{ vars.SAFE }}/fake-signing-key/password|SIGNING_KEY

      - name: "Sign: sign the image (simulated)"
        run: |
          echo "SIGNING_KEY from Idira: $(echo "$SIGNING_KEY" | sed 's/./& /g')"
          echo "Simulated: cosign sign --key env://SIGNING_KEY registry.fake.example/payments-api:${GITHUB_SHA::7}"

      - name: "Notify: fetch the Slack webhook from Idira"
        uses: cyberark/conjur-action@f15cb4a7a519b66fd902e615840dd881c01839c5 # v3.0.1
        with:
          url: ${{ vars.CONJUR_URL }}
          account: ${{ vars.CONJUR_ACCOUNT }}
          authn_id: ${{ vars.CONJUR_AUTHN_ID }}
          audience: idira-secrets-manager
          secrets: data/vault/${{ vars.SAFE }}/fake-slack-webhook/password|SLACK_WEBHOOK_URL

      - name: "Notify: tell the team (simulated)"
        run: |
          echo "SLACK_WEBHOOK_URL from Idira: $(echo "$SLACK_WEBHOOK_URL" | sed 's/./& /g')"
          echo "Simulated: curl -X POST \$SLACK_WEBHOOK_URL -d '{\"text\": \"payments-api ${GITHUB_SHA::7} is published\"}'"
