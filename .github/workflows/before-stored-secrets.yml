name: "Before: secrets stored in GitHub"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: "Scan: scan the code with SonarQube (simulated)"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "SONAR_TOKEN from GitHub secrets: $(echo "$SONAR_TOKEN" | sed 's/./& /g')"
          echo "Simulated: sonar-scanner -Dsonar.token=\$SONAR_TOKEN"

      - name: "Publish: push the image to the registry (simulated)"
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          echo "REGISTRY_USERNAME from GitHub secrets: $(echo "$REGISTRY_USERNAME" | sed 's/./& /g')"
          echo "REGISTRY_PASSWORD from GitHub secrets: $(echo "$REGISTRY_PASSWORD" | sed 's/./& /g')"
          echo "Simulated: docker login registry.fake.example -u \$REGISTRY_USERNAME -p \$REGISTRY_PASSWORD"
          echo "Simulated: docker push registry.fake.example/payments-api:${GITHUB_SHA::7}"

      - name: "Sign: sign the image (simulated)"
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "SIGNING_KEY from GitHub secrets: $(echo "$SIGNING_KEY" | sed 's/./& /g')"
          echo "Simulated: cosign sign --key env://SIGNING_KEY registry.fake.example/payments-api:${GITHUB_SHA::7}"

      - name: "Notify: tell the team (simulated)"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          echo "SLACK_WEBHOOK_URL from GitHub secrets: $(echo "$SLACK_WEBHOOK_URL" | sed 's/./& /g')"
          echo "Simulated: curl -X POST \$SLACK_WEBHOOK_URL -d '{\"text\": \"payments-api ${GITHUB_SHA::7} is published\"}'"
